<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant d'Homilétique Malagasy</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: #f8fafc;
        }

        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body class="text-slate-800 font-sans min-h-screen">

    <!-- HERO -->
    <header class="bg-gradient-to-r from-blue-900 via-indigo-800 to-slate-900 text-white py-16 px-6 shadow-lg">
        <div class="max-w-6xl mx-auto text-center">
            <h1 class="text-4xl md:text-5xl font-extrabold mb-4">
                📖 Assistant de Prédication Contextuelle
            </h1>
            <p class="text-lg md:text-xl text-blue-100 max-w-3xl mx-auto">
                Exégèse biblique, réflexion théologique, et herméneutique malagasy.
            </p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 md:px-6 py-10">

        <!-- FORMULAIRE -->
        <section class="bg-white rounded-2xl shadow-lg p-8 mb-8 flex flex-col gap-6">

            <!-- En-tête -->
            <div>
                <h2 class="text-2xl font-bold text-slate-900 mb-1">
                    Entrée du texte biblique
                </h2>
                <p class="text-sm text-slate-500">
                    Sélectionnez une action après avoir collé votre texte.
                </p>
            </div>

            <!-- Zone de saisie -->
            <div class="flex flex-col gap-2">
                <label for="bibleText" class="text-sm font-semibold text-slate-700">
                    Référence ou texte à analyser
                </label>
                <textarea id="bibleText" rows="5"
                    class="w-full border border-slate-300 rounded-xl p-4 focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none transition resize-y"
                    placeholder="Exemple : Matthieu 5:9 ou collez ici votre texte biblique complet..."></textarea>
            </div>

            <!-- Actions / Boutons Alignés Horizontalement -->
            <div class="flex flex-row items-center gap-4 pt-2 overflow-x-auto pb-2 scrollbar-thin">

                <!-- Analyser -->
                <button id="btnAnalyze"
                    class="flex-1 min-w-[160px] whitespace-nowrap px-5 py-3.5 bg-blue-700 hover:bg-blue-800 text-white rounded-xl font-semibold flex items-center justify-center gap-3 transition shadow-sm hover:shadow">
                    <span>Analyser le texte</span>
                    <div id="loaderAnalyze"
                        class="hidden animate-spin rounded-full h-5 w-5 border-2 border-white border-t-transparent">
                    </div>
                </button>

                <!-- Prédire -->
                <button id="btnPreach"
                    class="flex-1 min-w-[160px] whitespace-nowrap px-5 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl flex items-center justify-center gap-3 transition shadow-sm hover:shadow">
                    <span>Prédire le texte</span>
                    <div id="loaderPreach"
                        class="hidden animate-spin rounded-full h-5 w-5 border-2 border-white border-t-transparent">
                    </div>
                </button>

                <!-- Enseigner -->
                <button id="btnTeach"
                    class="flex-1 min-w-[160px] whitespace-nowrap px-5 py-3.5 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-xl flex items-center justify-center gap-3 transition shadow-sm hover:shadow">
                    <span>Enseigner le texte</span>
                    <div id="loaderTeach"
                        class="hidden animate-spin rounded-full h-5 w-5 border-2 border-white border-t-transparent">
                    </div>
                </button>

                <!-- Arranger -->
                <button id="btnArrange"
                    class="flex-1 min-w-[160px] whitespace-nowrap px-5 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl flex items-center justify-center gap-3 transition shadow-sm hover:shadow">
                    <span>Arranger le texte</span>
                    <div id="loaderArrange"
                        class="hidden animate-spin rounded-full h-5 w-5 border-2 border-white border-t-transparent">
                    </div>
                </button>

            </div>

        </section>

        <!-- RESULTATS -->
        <section id="resultSection" class="hidden space-y-8">

            <!-- RAPPORT -->
            <div class="bg-gradient-to-r from-slate-800 to-slate-900 text-white rounded-2xl p-6 shadow-lg">
                <div class="flex flex-col md:flex-row justify-between gap-4">
                    <div>
                        <p class="uppercase text-xs tracking-widest text-blue-300">
                            Rapport d'Orientation Exégétique
                        </p>
                        <h2 id="genreLittéraire" class="text-2xl font-bold mt-2">
                            Genre :
                        </h2>
                    </div>
                    <div class="bg-slate-700 px-5 py-4 rounded-xl">
                        <p class="text-xs text-gray-300">
                            Méthode utilisée
                        </p>
                    </div>
                </div>
            </div>

        </section>

    </main>

</body>
</html>
